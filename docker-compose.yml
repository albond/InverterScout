name: inverterscout

services:
  inverterscout:
    build: .
    restart: unless-stopped
    environment:
      SETUP_BIND_HOST: 0.0.0.0
      WEB_PORT: 8080
      INVERTERSCOUT_MASTER_KEY: ${INVERTERSCOUT_MASTER_KEY:-}
    ports:
      - "${INVERTERSCOUT_BIND_ADDRESS:-127.0.0.1}:${INVERTERSCOUT_WEB_PORT:-8080}:8080"
    volumes:
      - inverterscout_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  inverterscout_data:
