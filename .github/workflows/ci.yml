name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      PYTHONWARNINGS: error::ResourceWarning
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: make lint
      - name: Run tests with branch coverage
        env:
          INVERTERSCOUT_DATA_DIR: ${{ runner.temp }}/inverterscout-test-data
        run: make test-cov
      - name: Build Python package
        run: python -m pip wheel . --no-deps --wheel-dir dist

  container:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build container
        run: docker compose build

  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Run native Windows launcher checks
        shell: cmd
        run: start.bat --self-test
      - name: Verify launcher help
        shell: cmd
        run: start.bat --help
